#    restart: unless-stopped

  tdm_bot:
    build:
      context: .
      dockerfile: ./tdm_bot/Dockerfile
    container_name: suprasport_messenger_bot
    volumes:
      # Видео для утренней рассылки: можно накидывать файлы в ./tdm_bot/bot_documents/video
      # на хосте — пересобирать образ не нужно. Read-only: бот только читает.
      - ./tdm_bot/bot_documents/video:/app/bot_documents/video:ro
    environment:
      TZ: "${TZ:-Europe/Moscow}"
      MESSENGER_TOKEN: "${MESSENGER_TOKEN}"
      MESSENGER_REST: "${MESSENGER_REST}"
      MESSENGER_SSE: "${MESSENGER_SSE}"
      MESSENGER_FILE: "${MESSENGER_FILE}"
      DB_HOST: "${DB_HOST}"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
    depends_on:
      - db
    networks:
      suprasport_net:
        ipv4_address: 192.168.1.40
    restart: unless-stopped


  nginx:
    image: nginx:1.27.3
    env_file:
      - .env
    container_name: suprasport_nginx
    depends_on:
      - superset
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      #- ./nginx/certs:/etc/nginx/certs
    ports:
      - "80:80"
      - "443:443"
    networks:
     suprasport_net:
       ipv4_address: 192.168.1.10
    restart: unless-stopped

volumes:
  postgres_data:
  superset_home:

networks:
  suprasport_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24